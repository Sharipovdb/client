
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>srp-transport</title>
    <script>
      // Mirrors applyThemePreference in src/lib/theme.ts. It runs before the first paint
      // so a dark-theme user never sees a flash of the light theme.
      try {
        var preference = JSON.parse(localStorage.getItem('srp-transport.theme'))
        document.documentElement.classList.toggle('dark', preference === 'dark')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
